# ============================================================================
# FILE:       backend-test/alembic.ini
# PURPOSE:    Configuration for Alembic, the database migration tool: where
#             migration scripts live and how migration output is logged.
# HOW IT WORKS: Alembic reads this INI file when you run `alembic upgrade head`
#             (apply) or `alembic downgrade -1` (revert). The database URL is
#             NOT stored here — alembic/env.py injects it from app/config.py
#             so secrets have exactly one home (.env).
# USED BY / DEPENDS ON: the `alembic` CLI; alembic/env.py reads section keys.
# KEY CONCEPTS: migrations, INI configuration, Python logging hierarchy.
# ============================================================================

[alembic]
# Where Alembic writes its migration scripts (one .py per schema change).
# %(here)s resolves to the folder that contains this file, so the path stays
# correct no matter which working directory the command runs from.
script_location = %(here)s/alembic

# Adds the project root to sys.path so alembic can import `app.*` modules
prepend_sys_path = %(here)s.

# Left empty on purpose: alembic/env.py supplies the URL at runtime from
# DATABASE_URL in .env. SECURITY: never paste a password into this file.
# sqlalchemy.url =

# --- Logging configuration (standard Python logging sections) --------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
# WARN hides routine INFO chatter from third-party libraries
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Change to INFO to see every SQL statement Alembic executes (very verbose)
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO shows the "Running upgrade a -> b" progress lines during migrations
level = INFO
handlers =
qualname = alembic

[handler_console]
# Writes log records to the terminal's standard error stream
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Format: 5-char level name, logger name, then the message (HH:MM:SS time)
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
