# ============================================================================
# FILE:       backend-test/pyproject.toml
# PURPOSE:    Project metadata, the dependency manifest Vercel installs, the
#             Python runtime pin and the explicit Vercel entrypoint.
# HOW IT WORKS: Vercel reads `[project].dependencies` (installed with uv) and
#             `[tool.vercel].entrypoint` (the module that exposes the ASGI
#             `app` object). `requires-python` is bounded to 3.12 because
#             asyncpg and pydantic-core have no wheels for 3.14 yet.
#             The dependency list below is identical to requirements.txt —
#             Vercel prefers pyproject.toml, so the two must never drift.
# USED BY / DEPENDS ON: Vercel build step, `uv sync`, `pip install -e .`,
#             ruff.
# KEY CONCEPTS: PEP 621 metadata, uv as the installer, entrypoint pinning.
# ============================================================================

[project]
name = "taskflow-backend"
version = "1.0.0"
description = "TaskFlow API — FastAPI backend for the Todo application, deployed on Vercel."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.19",
    "SQLAlchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "google-auth==2.33.0",
    "aiosmtplib==3.0.2",
    "httpx==0.28.1",
    "anyio==4.7.0",
    "python-dotenv==1.0.1",
    "brevo-python",
    
]

[tool.uv]
# This project is an application, not a library: `uv sync` installs the
# dependencies only and never tries to build or install the project itself.
package = false

[tool.vercel]
# The module Vercel loads to find the ASGI `app` object. It matches the
# `functions` key in vercel.json ("main.py").
entrypoint = "main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
